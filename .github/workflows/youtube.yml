name: Enviar Shorts pendentes ao YouTube
on:
  # Sobe o que ficou pendente (limite diário de envios do canal) sem depender do PC. A cada 3 h.
  workflow_dispatch: {}
  schedule:
    - cron: "20 */3 * * *"
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 google-api-python-client==2.154.0 google-auth==2.36.0
      - name: Enviar pendentes
        env:
          YT_PT: ${{ secrets.YT_PT }}
          YT_EN: ${{ secrets.YT_EN }}
        run: python publicar_youtube.py
      - name: Salvar a agenda
        run: |
          if ! git diff --quiet agenda_yt.json; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add agenda_yt.json
            git commit -m "agenda_yt: atualizada pelo publicador"
            git pull --rebase origin main
            git push
          fi
