name: Publicar Reels do Instagram
on:
  # Disparado pelo cron-job.org nos horários de post (11h, 12h, 18h, 21h de Brasília, aos :02 e :32).
  # O "schedule" do GitHub foi removido: em repositório privado ele atrasava horas e gastava minutos.
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"     # reserva: 1x por dia (00h17 de Brasília) pega o que tiver ficado para trás
    - cron: "5,35 14-23,0-1 * * *"  # reserva do despertador: a cada 30 min das 11h às 22h de Brasília (o GitHub pode atrasar alguns minutos)
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Publicar o que venceu
        env:
          META_IG: ${{ secrets.META_IG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python publicar_instagram.py
      - name: Salvar a agenda
        run: |
          if ! git diff --quiet agenda.json; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add agenda.json
            git commit -m "agenda: atualizada pelo publicador"
            git push
          fi
