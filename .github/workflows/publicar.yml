name: Publicar Reels do Instagram
on:
  schedule:
    - cron: "2,32 * * * *"   # a cada 30 min (horário UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Publicar o que venceu
        env:
          META_IG: ${{ secrets.META_IG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python publicar_instagram.py
      - name: Salvar a agenda
        run: |
          if ! git diff --quiet agenda.json; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add agenda.json
            git commit -m "agenda: atualizada pelo publicador"
            git push
          fi
