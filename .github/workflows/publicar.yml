name: Publicar (Instagram, Facebook, TikTok)
on:
  # Disparos: cron-job.org (no horário certo) + o agendamento do próprio GitHub como reserva (pode atrasar).
  # Cada execução só publica o que já venceu (até 6 h de atraso), então disparos repetidos não duplicam nada.
  workflow_dispatch: {}
  schedule:
    - cron: "2,32 14-23 * * *"   # 11h às 20h32 de Brasília, a cada 30 min
    - cron: "2,32 0-2 * * *"     # 21h às 23h32 de Brasília
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Publicar o que venceu
        env:
          META_UNIDADES: ${{ secrets.META_UNIDADES }}
          META_IG: ${{ secrets.META_IG }}
          TIKTOK_APP: ${{ secrets.TIKTOK_APP }}
          TIKTOK_TOKENS: ${{ secrets.TIKTOK_TOKENS }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO }}
        run: python publicar_v2.py
      - name: Salvar a agenda
        run: |
          if ! git diff --quiet agenda_v2.json; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add agenda_v2.json
            git commit -m "agenda_v2: atualizada pelo publicador"
            git pull --rebase origin main
            git push
          fi
